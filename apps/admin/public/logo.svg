<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040812" stop-opacity="0" />
    </radialGradient>

    <!-- Dragon Primary Blue-Cyan Gradient -->
    <linearGradient id="dragonPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Dragon Highlight Gradient -->
    <linearGradient id="dragonHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Dragon Dark Shadow Gradient -->
    <linearGradient id="dragonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Fiery Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Badge Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Eye Glow Filter -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crest Glow Filter -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Outer Cyber-Shield Hexagon -->
  <path d="M 256 24 L 460 116 L 460 396 L 256 488 L 52 396 L 52 116 Z" 
        fill="#070d1e" 
        stroke="url(#borderGrad)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Inner Tech Circuit Accents -->
  <path d="M 256 48 L 436 130 L 436 382 L 256 464 L 76 382 L 76 130 Z" 
        fill="#040813" 
        stroke="#1e3a8a" 
        stroke-width="2" 
        stroke-opacity="0.6" 
        stroke-linejoin="round" />

  <!-- Dragon Vector Art (Geometric Dragon Head Emblem) -->
  <g id="dragon-head">
    <!-- Main Upper Horn Left/Top (Massive Horn Sweeping Up-Right) -->
    <path d="M 256 90 L 330 130 L 415 95 L 365 175 L 435 185 L 350 230 L 320 200 L 256 220 Z" 
          fill="url(#dragonHighlight)" 
          opacity="0.95" />
    
    <!-- Horn Underside Shadow -->
    <path d="M 256 120 L 330 150 L 415 95 L 350 200 L 320 200 Z" 
          fill="url(#dragonDark)" 
          opacity="0.6" />

    <!-- Secondary Crown Horns / Spikes -->
    <path d="M 200 130 L 256 90 L 265 160 L 215 175 Z" 
          fill="url(#dragonPrimary)" />
    <path d="M 155 170 L 205 135 L 215 195 L 165 210 Z" 
          fill="url(#dragonHighlight)" />
    <path d="M 120 220 L 160 180 L 170 240 L 125 255 Z" 
          fill="url(#dragonPrimary)" />

    <!-- Dragon Cranium / Forehead Armor Plate -->
    <path d="M 220 180 L 310 180 L 345 235 L 290 265 L 210 240 Z" 
          fill="url(#dragonPrimary)" 
          stroke="#00f0ff" 
          stroke-width="1.5" 
          stroke-linejoin="round" />

    <!-- Dragon Snout & Upper Beak/Jaw (Sharp Aggressive Profile Facing Left) -->
    <path d="M 220 225 L 290 260 L 255 300 L 135 305 L 105 270 L 175 250 L 195 225 Z" 
          fill="url(#dragonHighlight)" 
          stroke="#38bdf8" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Upper Fangs / Serrated Teeth -->
    <polygon points="125,295 140,330 155,298" fill="#ffffff" />
    <polygon points="160,298 172,326 185,299" fill="#ffffff" />
    <polygon points="190,299 200,320 212,300" fill="#ffffff" />

    <!-- Nostril / Plasma Vent -->
    <path d="M 130 275 L 155 270 L 145 282 Z" fill="#00f0ff" filter="url(#eyeGlow)" />

    <!-- Lower Mandible / Jaw (Aggressive Chiseled Underbite) -->
    <path d="M 150 335 L 245 330 L 285 365 L 235 410 L 175 390 L 130 355 Z" 
          fill="url(#dragonPrimary)" 
          stroke="#00f0ff" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Lower Jaw Fangs -->
    <polygon points="145,345 155,320 168,343" fill="#ffffff" />
    <polygon points="175,343 185,322 198,340" fill="#ffffff" />

    <!-- Throat & Neck Armor Scales (Layered Plating) -->
    <path d="M 245 335 L 340 300 L 375 360 L 305 415 L 235 410 Z" 
          fill="url(#dragonDark)" 
          stroke="#2563eb" 
          stroke-width="2" />
    <path d="M 285 365 L 375 360 L 400 420 L 330 455 L 265 440 Z" 
          fill="url(#dragonPrimary)" 
          stroke="#38bdf8" 
          stroke-width="1.5" />
    <path d="M 330 415 L 420 400 L 440 445 L 365 475 L 310 460 Z" 
          fill="url(#dragonHighlight)" 
          stroke="#00f0ff" 
          stroke-width="1.5" />

    <!-- Glowing Cyber Dragon Eye (Intense Piercing Slit) -->
    <g filter="url(#eyeGlow)">
      <!-- Eye Socket Shadow -->
      <polygon points="215,235 260,240 245,260 205,250" fill="#020617" />
      <!-- Glowing Eye Core -->
      <polygon points="220,240 255,243 248,255 215,250" fill="#00f0ff" />
      <!-- Inner Slit Iris -->
      <polygon points="232,238 242,242 238,256 230,252" fill="#ffffff" />
      <!-- Eye Energy Trail -->
      <path d="M 255 243 L 320 220 L 300 235 Z" fill="#00f0ff" opacity="0.8" />
    </g>

    <!-- Energy Veins / Glow Lines along Scales -->
    <path d="M 220 180 L 290 265 L 245 335 L 175 390" 
          fill="none" 
          stroke="#00f0ff" 
          stroke-width="3" 
          stroke-linecap="round" 
          filter="url(#eyeGlow)" />
          
    <path d="M 290 260 L 350 200" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <path d="M 245 330 L 340 300" 
          fill="none" 
          stroke="#67e8f9" 
          stroke-width="2" 
          stroke-linecap="round" />
  </g>

  <!-- High-Tech Corner Accent Notches -->
  <polygon points="256,28 266,42 246,42" fill="#00f0ff" filter="url(#eyeGlow)" />
  <polygon points="256,484 266,470 246,470" fill="#00f0ff" filter="url(#eyeGlow)" />
  <circle cx="52" cy="116" r="4" fill="#00f0ff" filter="url(#eyeGlow)" />
  <circle cx="460" cy="116" r="4" fill="#00f0ff" filter="url(#eyeGlow)" />
  <circle cx="52" cy="396" r="4" fill="#00f0ff" filter="url(#eyeGlow)" />
  <circle cx="460" cy="396" r="4" fill="#00f0ff" filter="url(#eyeGlow)" />
</svg>
