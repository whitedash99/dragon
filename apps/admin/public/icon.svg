<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favApexCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="80%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0044cc" />
    </linearGradient>

    <linearGradient id="favApexDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="favApexChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="favApexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="favApexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Cyber Octagon / Badge -->
  <rect width="128" height="128" rx="28" fill="#02050f" />
  <rect x="3" y="3" width="122" height="122" rx="26" fill="#06122c" stroke="url(#favApexBorder)" stroke-width="3" />

  <!-- 1. OUTER DRACONIC MANTLE WINGS / SHIELD -->
  <path d="M 20 42 L 10 68 L 26 88 L 38 78 L 28 56 Z" fill="url(#favApexDark)" stroke="#00f0ff" stroke-width="1.5" />
  <path d="M 28 56 L 10 68 L 26 88 Z" fill="url(#favApexCyan)" opacity="0.35" />

  <path d="M 108 42 L 118 68 L 102 88 L 90 78 L 100 56 Z" fill="url(#favApexDark)" stroke="#00f0ff" stroke-width="1.5" />
  <path d="M 100 56 L 118 68 L 102 88 Z" fill="url(#favApexCyan)" opacity="0.35" />

  <!-- 2. SWEEPING APEX HORNS -->
  <path d="M 52 44 L 20 12 L 36 38 L 46 54 Z" fill="url(#favApexChrome)" stroke="#00f0ff" stroke-width="1.5" />
  <path d="M 36 38 L 14 30 L 28 48 Z" fill="url(#favApexCyan)" />

  <path d="M 76 44 L 108 12 L 92 38 L 82 54 Z" fill="url(#favApexChrome)" stroke="#00f0ff" stroke-width="1.5" />
  <path d="M 92 38 L 114 30 L 100 48 Z" fill="url(#favApexCyan)" />

  <!-- 3. DRAGON CROWN SPIKES -->
  <polygon points="64,14 71,36 64,46 57,36" fill="url(#favApexChrome)" stroke="#00f0ff" stroke-width="1.5" />
  <polygon points="52,24 57,38 48,42" fill="url(#favApexCyan)" />
  <polygon points="76,24 71,38 80,42" fill="url(#favApexCyan)" />

  <!-- 4. FOREHEAD & BROW ARMOR -->
  <polygon points="64,44 76,56 64,70 52,56" fill="url(#favApexDark)" stroke="#00f0ff" stroke-width="1.8" />
  <polygon points="64,48 72,56 64,66 56,56" fill="url(#favApexCyan)" opacity="0.8" />

  <!-- 5. PIERCING GLOWING EYES -->
  <g filter="url(#favApexGlow)">
    <polygon points="40,58 52,61 48,67 38,63" fill="#00f0ff" />
    <polygon points="43,60 49,62 47,65 41,63" fill="#ffffff" />
    <polygon points="88,58 76,61 80,67 90,63" fill="#00f0ff" />
    <polygon points="85,60 79,62 81,65 87,63" fill="#ffffff" />
  </g>

  <!-- 6. DRAGON SNOUT & NOSE BRIDGE -->
  <polygon points="56,66 72,66 76,82 64,90 52,82" fill="url(#favApexChrome)" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="58,80 62,82 60,84" fill="#020617" />
  <polygon points="70,80 66,82 68,84" fill="#020617" />

  <!-- 7. DEADLY SERRATED FANGS -->
  <polygon points="53,82 56,94 60,84" fill="#ffffff" />
  <polygon points="68,84 72,94 75,82" fill="#ffffff" />
  <polygon points="61,84 64,91 67,84" fill="#ffffff" />

  <!-- 8. CHISELED LOWER MANDIBLE & CHIN SPIKES -->
  <polygon points="50,92 64,116 78,92 64,100" fill="url(#favApexDark)" stroke="#00f0ff" stroke-width="1.8" />
  <polygon points="38,88 48,104 52,94" fill="url(#favApexCyan)" />
  <polygon points="90,88 80,104 76,94" fill="url(#favApexCyan)" />

  <!-- 9. CENTRAL ENERGY SPARK -->
  <circle cx="64" cy="56" r="3.5" fill="#ffffff" filter="url(#favApexGlow)" />
</svg>
