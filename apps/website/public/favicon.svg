<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="icGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="icHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="icBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="icGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Cyber Octagon -->
  <rect width="128" height="128" rx="28" fill="#040814" />
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#071126" stroke="url(#icBorder)" stroke-width="3.5" />

  <!-- Dragon Crest Vector Geometry -->
  <g transform="translate(6, 6) scale(0.9)">
    <!-- Dragon Main Horns -->
    <path d="M 64 22 L 84 34 L 110 24 L 94 48 L 116 52 L 88 66 L 78 56 L 64 62 Z" 
          fill="url(#icHighlight)" />
    
    <!-- Crown Spikes -->
    <path d="M 48 34 L 64 22 L 66 42 L 52 46 Z" fill="url(#icGrad)" />
    <path d="M 34 46 L 48 36 L 50 54 L 36 58 Z" fill="url(#icHighlight)" />
    <path d="M 24 60 L 36 48 L 38 66 L 26 70 Z" fill="url(#icGrad)" />

    <!-- Dragon Forehead & Snout Profile -->
    <path d="M 54 50 L 78 52 L 88 68 L 74 76 L 52 68 Z" fill="url(#icGrad)" stroke="#00f0ff" stroke-width="1.5" />
    <path d="M 54 62 L 74 72 L 64 84 L 28 84 L 20 74 L 42 68 Z" fill="url(#icHighlight)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Sharp Fangs -->
    <polygon points="26,82 32,94 38,83" fill="#ffffff" />
    <polygon points="40,83 45,92 50,83" fill="#ffffff" />

    <!-- Aggressive Lower Jaw -->
    <path d="M 32 94 L 62 92 L 74 102 L 60 114 L 42 108 L 28 98 Z" fill="url(#icGrad)" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="30,96 34,88 38,95" fill="#ffffff" />

    <!-- Neck Armor Plates -->
    <path d="M 62 94 L 88 84 L 98 100 L 78 116 L 60 114 Z" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <path d="M 74 102 L 98 100 L 106 116 L 86 126 L 68 122 Z" fill="url(#icHighlight)" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Glowing Cyan Dragon Eye -->
    <g filter="url(#icGlow)">
      <polygon points="56,66 68,68 64,74 54,70" fill="#00f0ff" />
      <polygon points="59,67 63,68 62,73 58,72" fill="#ffffff" />
      <!-- Glow Trail -->
      <path d="M 68 68 L 84 62 L 78 67 Z" fill="#00f0ff" />
    </g>

    <!-- Energy Line -->
    <path d="M 54 50 L 74 72 L 62 94 L 42 108" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#icGlow)" />
  </g>
</svg>
